[project]
name = "pdf-mcp-ocr-more-secure"
version = "0.1.0"
description = "Hardened MCP PDF reader with pytesseract OCR fallback. Internal fork of jztan/pdf-mcp; strips upstream publishing code, pins deps, adds an always-on HTTPS-only + SSRF floor for URL sources and a user-configurable path/URL allow-deny layer. For single-user installation on a locked-down workstation on a secured internal network."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "rma" }
]
maintainers = [
    { name = "rma" }
]
keywords = [
    "mcp",
    "pdf", 
    "ai",
    "claude",
    "llm",
    "document-processing",
    "model-context-protocol",
    "anthropic",
    "pdf-extraction",
    "ai-agent",
    "pdf-reader",
    "document-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Pinned exactly — no `>=`. Combined with `uv.lock` (committed, contains
    # per-package hashes) and `uv sync --frozen` in install paths + CI, this
    # blocks future-malicious-version auto-install and registry tarball swaps.
    # See SECURITY-AUDIT.md for the supply-chain chapter and the re-lock recipe.
    "fastmcp==3.2.0",
    "pymupdf==1.27.2.2",
    "pydantic==2.12.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pillow>=12.2.0,<13.0",
    "mypy==1.19.1",
    "flake8==7.3.0",
    "black==26.3.1",
    "pip-audit==2.10.0",
    # numpy has unusual cross-Python version constraints (2.3+ requires 3.11+),
    # so this is a compatible-range pin rather than exact. The committed
    # uv.lock pins to a single concrete version + hashes, so the supply-chain
    # control is not weakened.
    "numpy>=2.2.6,<3.0.0",
    # Matplotlib is dev-only; used by the OCR integration tests to generate
    # synthetic scan-like PDFs (rasterised text pages) for real-Tesseract
    # round-trip verification.
    "matplotlib>=3.8.0,<4.0",
]

semantic = [
    "fastembed==0.8.0",
    "numpy>=2.2.6,<3.0.0",
]

ocr = [
    "pytesseract==0.3.13",
    "pillow>=12.2.0,<13.0",
]

[project.urls]
Homepage = "https://github.com/rekeshali/pdf-mcp-ocr-more-secure"
Repository = "https://github.com/rekeshali/pdf-mcp-ocr-more-secure"
Upstream = "https://github.com/jztan/pdf-mcp"

[project.scripts]
pdf-mcp-ocr = "pdf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Source lives at src/pdf_mcp/ (inherited from upstream jztan/pdf-mcp) but our
# project name doesn't match the module name. Tell hatchling explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/pdf_mcp"]

# Constraint-dependencies force transitive deps to specific versions without
# declaring them as our own runtime deps. Used to pin away from CVEs surfaced
# by pip-audit. These are NOT added to the install closure; they only kick in
# when a transitive dep would otherwise pick a vulnerable version.
[tool.uv]
constraint-dependencies = [
    "authlib>=1.6.11",          # GHSA-jj8c-mmj3-mmgv (via fastmcp chain)
    "cryptography>=46.0.7",     # CVE-2026-39892 (via authlib / httpx chain)
    "pygments>=2.20.0",         # CVE-2026-4539 (via pip-audit / other tooling)
    "python-multipart>=0.0.26", # CVE-2026-40347 (via fastmcp chain)
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
    "ignore:builtin type Swig:DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pymupdf"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pdf_mcp.extractor", "pdf_mcp.server", "pdf_mcp.embedder"]
disallow_untyped_calls = false
warn_unused_ignores = false
